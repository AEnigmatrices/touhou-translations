name: Temporary dependency refresh
on:
  push:
    branches:
      - chore/gallery-and-dependencies-2026-10
    paths:
      - .github/workflows/content-intake-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/gallery-and-dependencies-2026-10
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          install: false
      - name: Update dependencies within supported version ranges
        run: pnpm update
      - name: Run validation suite
        run: pnpm run test
      - name: Build site
        run: pnpm run build
      - name: Commit dependency lockfile if verified
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git diff --cached --quiet || git commit -m "deps: refresh resolved dependencies"
          git push
