name: Refresh pnpm lockfile

on:
    push:
        branches:
            - chore/maintenance-audit-2026-09

permissions:
    contents: write

jobs:
    refresh-lockfile:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                  ref: chore/maintenance-audit-2026-09

            - name: Setup pnpm and Node.js
              uses: pnpm/setup@v2
              with:
                  runtime: node@24
                  cache: true
                  cache-dependency-path: pnpm-lock.yaml
                  install: false

            - name: Refresh lockfile
              run: pnpm install --lockfile-only --no-frozen-lockfile

            - name: Commit refreshed lockfile
              run: |
                  if git diff --quiet -- pnpm-lock.yaml; then
                      echo "pnpm-lock.yaml is already current."
                      exit 0
                  fi

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add pnpm-lock.yaml
                  git commit -m "chore: refresh pnpm lockfile [skip ci]"
                  git push origin HEAD:chore/maintenance-audit-2026-09
